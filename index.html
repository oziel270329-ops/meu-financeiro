<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171c; --bg-panel:#1c2028; --bg-elevated:#242933; --bg-hover:#2a303b;
  --border:#2d323d; --text:#e7e5df; --text-dim:#8b92a1; --text-faint:#5a616f;
  --green:#4fb286; --green-dim:#2c4438;
  --red:#d1603d; --red-dim:#452e26;
  --amber:#d9a441; --amber-dim:#3f3722;
  --blue:#5b8dd6; --blue-dim:#25364d;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

/* Sidebar */
.sidebar{
  width:220px; min-width:220px; background:var(--bg-panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 0; position:sticky; top:0; height:100vh;
}
.brand{padding:0 20px 20px; border-bottom:1px solid var(--border); margin-bottom:12px;}
.brand-mark{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--amber); font-weight:600;}
.brand-title{font-size:17px; font-weight:700; margin-top:4px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 20px; color:var(--text-dim);
  cursor:pointer; font-size:14px; font-weight:500; border-left:2px solid transparent;
  transition:.15s;
}
.nav-item:hover{background:var(--bg-hover); color:var(--text);}
.nav-item.active{background:var(--bg-elevated); color:var(--text); border-left-color:var(--amber);}
.nav-icon{width:16px; text-align:center; font-size:14px;}
.sidebar-foot{margin-top:auto; padding:14px 20px; font-size:11px; color:var(--text-faint); border-top:1px solid var(--border);}

/* Main */
.main{flex:1; padding:32px 40px; max-width:1180px;}
.page-title{font-size:22px; font-weight:700; margin-bottom:4px;}
.page-sub{font-size:13px; color:var(--text-dim); margin-bottom:24px;}

/* Cards / panels */
.panel{background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:20px;}
.panel-title{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); margin-bottom:14px;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
.stat{background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:16px 18px;}
.stat-label{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
.stat-value{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700;}
.stat-value.green{color:var(--green);} .stat-value.red{color:var(--red);} .stat-value.amber{color:var(--amber);} .stat-value.blue{color:var(--blue);}
.stat-note{font-size:11.5px; color:var(--text-faint); margin-top:4px;}

/* Forms */
.form-row{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:6px;}
.field{display:flex; flex-direction:column; gap:5px; flex:1; min-width:120px;}
.field label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px;}
input, select{
  background:var(--bg-elevated); border:1px solid var(--border); color:var(--text);
  padding:9px 10px; border-radius:6px; font-size:13.5px; font-family:inherit; outline:none;
}
input:focus, select:focus{border-color:var(--amber);}
input[type=number]{font-family:'JetBrains Mono',monospace;}
.btn{
  background:var(--amber); color:#1a1508; border:none; padding:10px 16px; border-radius:6px;
  font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; transition:.15s;
}
.btn:hover{filter:brightness(1.1);}
.btn.secondary{background:var(--bg-elevated); color:var(--text); border:1px solid var(--border);}
.btn.danger{background:var(--red-dim); color:var(--red); border:1px solid var(--red);}
.btn-sm{padding:5px 10px; font-size:12px; border-radius:5px;}
.btn-icon{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:4px 7px; border-radius:5px;}
.btn-icon:hover{background:var(--bg-hover); color:var(--text);}

/* Table */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; border-bottom:1px solid var(--border); font-weight:600;}
td{padding:10px 10px; border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg-hover);}
.num{font-family:'JetBrains Mono',monospace; text-align:right;}
.tag{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600;}
.tag.green{background:var(--green-dim); color:var(--green);}
.tag.red{background:var(--red-dim); color:var(--red);}
.tag.amber{background:var(--amber-dim); color:var(--amber);}
.tag.blue{background:var(--blue-dim); color:var(--blue);}
.empty{color:var(--text-faint); font-size:13px; padding:20px 0; text-align:center;}

/* Ledger tape (dashboard signature element) */
.tape{display:flex; gap:0; overflow-x:auto; padding:4px 0 10px;}
.tape-month{
  min-width:88px; border-right:1px dashed var(--border); padding:0 14px; text-align:center;
  display:flex; flex-direction:column; gap:6px;
}
.tape-month:first-child{padding-left:2px;}
.tape-label{font-size:11px; color:var(--text-dim); font-weight:600;}
.tape-bar-wrap{height:70px; display:flex; align-items:flex-end; justify-content:center;}
.tape-bar{width:22px; border-radius:3px 3px 0 0; background:var(--amber); min-height:3px;}
.tape-val{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);}

.month-nav{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.month-nav .btn-icon{font-size:16px;}
.month-nav .current{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; min-width:150px; text-align:center;}

.section-flex{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.hint{font-size:12px; color:var(--text-faint); margin-top:8px; line-height:1.5;}
.checkbox-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim);}
.checkbox-row input{width:auto; padding:0;}

/* ===== MODO MOBILE ===== */
body.mobile-mode{flex-direction:column;}
body.mobile-mode .sidebar{
  display:none;
}
/* Bottom nav bar */
.mobile-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:var(--bg-panel); border-top:1px solid var(--border);
  flex-direction:row; justify-content:space-around; align-items:center;
  padding:6px 0 env(safe-area-inset-bottom, 6px);
}
body.mobile-mode .mobile-nav{ display:flex; }
.mobile-nav-item{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 10px; cursor:pointer; color:var(--text-faint); font-size:10px;
  font-weight:600; letter-spacing:.3px; border-radius:8px; transition:.15s; flex:1;
}
.mobile-nav-item .mn-icon{ font-size:18px; }
.mobile-nav-item.active{ color:var(--amber); }
.mobile-nav-item:hover{ background:var(--bg-hover); }

/* Header mobile */
.mobile-header{
  display:none; position:sticky; top:0; z-index:99;
  background:var(--bg-panel); border-bottom:1px solid var(--border);
  padding:12px 16px; align-items:center; justify-content:space-between;
}
body.mobile-mode .mobile-header{ display:flex; }
.mobile-header-title{ font-size:15px; font-weight:700; }
.mobile-header-sub{ font-size:11px; color:var(--text-dim); }
.mobile-drive-dot{
  width:8px; height:8px; border-radius:50%; background:var(--text-faint);
  display:inline-block; margin-right:4px;
}
.mobile-drive-dot.connected{ background:var(--green); }

/* Botão alternar modo */
.toggle-mode-btn{
  position:fixed; bottom:72px; right:14px; z-index:200;
  background:var(--bg-elevated); border:1px solid var(--border);
  color:var(--text-dim); font-size:11px; padding:6px 10px;
  border-radius:20px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4);
  display:flex; align-items:center; gap:5px;
}
body:not(.mobile-mode) .toggle-mode-btn{
  bottom:14px;
}

/* Ajuste do main no mobile */
body.mobile-mode .main{
  padding:16px; padding-bottom:80px; max-width:100%;
}
body.mobile-mode .stat-grid{
  grid-template-columns: repeat(2, 1fr); gap:10px;
}
body.mobile-mode .stat-value{ font-size:17px; }
body.mobile-mode .form-row{ flex-direction:column; }
body.mobile-mode .field{ min-width:100%; }
body.mobile-mode table{ font-size:12px; }
body.mobile-mode td, body.mobile-mode th{ padding:8px 6px; }
body.mobile-mode .page-title{ font-size:18px; }
body.mobile-mode .tape-month{ min-width:70px; }
body.mobile-mode .panel{ padding:14px; }
</style>
</head>
<body>

<!-- Header mobile -->
<div class="mobile-header">
  <div>
    <div class="mobile-header-title">Meu Financeiro</div>
    <div class="mobile-header-sub" id="mobile-status">Carregando…</div>
  </div>
  <button class="btn secondary btn-sm" onclick="gdriveLogin()" id="btn-gdrive-mobile" style="font-size:11px">☁ Drive</button>
</div>

<div class="sidebar">
  <div class="brand">
    <div class="brand-mark">CONTROLE // v1</div>
    <div class="brand-title">Meu Financeiro</div>
  </div>
  <div class="nav-item active" data-tab="dashboard"><span class="nav-icon">◆</span>Dashboard</div>
  <div class="nav-item" data-tab="entradas"><span class="nav-icon">✚</span>Entradas</div>
  <div class="nav-item" data-tab="fixas"><span class="nav-icon">▤</span>Contas Fixas</div>
  <div class="nav-item" data-tab="cartoes"><span class="nav-icon">▥</span>Cartões</div>
  <div class="nav-item" data-tab="gastos"><span class="nav-icon">▦</span>Gastos do Mês</div>
  <div class="nav-item" data-tab="projecao"><span class="nav-icon">▧</span>Projeção</div>
  <div class="sidebar-foot" id="storage-status">Carregando dados…</div>
  <div style="padding:8px 20px; display:flex; flex-direction:column; gap:6px;">
    <button class="btn btn-sm" id="btn-gdrive" onclick="gdriveLogin()" style="background:var(--blue);color:#fff;font-size:12px">☁ Conectar Google Drive</button>
    <div style="display:flex;gap:6px">
      <button class="btn secondary btn-sm" onclick="exportData()" title="Exportar backup JSON" style="font-size:11px">⬇ Backup</button>
      <label class="btn secondary btn-sm" style="cursor:pointer;font-size:11px" title="Importar backup JSON">⬆ Importar<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
    </div>
  </div>
</div>

<div class="main" id="main"></div>

<!-- Bottom nav mobile -->
<nav class="mobile-nav">
  <div class="mobile-nav-item active" data-tab="dashboard"><span class="mn-icon">◆</span>Painel</div>
  <div class="mobile-nav-item" data-tab="entradas"><span class="mn-icon">✚</span>Entradas</div>
  <div class="mobile-nav-item" data-tab="fixas"><span class="mn-icon">▤</span>Fixas</div>
  <div class="mobile-nav-item" data-tab="cartoes"><span class="mn-icon">▥</span>Cartões</div>
  <div class="mobile-nav-item" data-tab="gastos"><span class="mn-icon">▦</span>Gastos</div>
  <div class="mobile-nav-item" data-tab="projecao"><span class="mn-icon">▧</span>Projeção</div>
</nav>

<!-- Botão alternar modo -->
<button class="toggle-mode-btn" onclick="toggleMode()" id="toggle-mode-btn">📱 Mobile</button>

<script>
// ---------- Estado ----------
let appData = { recurringDebts: [], cards: [], purchases: [], expenses: [], incomes: [] };
let currentTab = 'dashboard';
let viewMonth = ymNow();
let editing = { fixas: null, cartoes: null, gastos: null, purchaseCard: null, fixaOverride: null, entradaEdit: null, purchaseEdit: null };
let projRange = 12;
let isMobile = false;

// ---------- Modo Mobile/Desktop ----------
function detectMode(){
  const saved = localStorage.getItem('financeiro-view-mode');
  if(saved) return saved === 'mobile';
  return window.innerWidth <= 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function applyMode(mobile){
  isMobile = mobile;
  document.body.classList.toggle('mobile-mode', mobile);
  const btn = document.getElementById('toggle-mode-btn');
  if(btn) btn.textContent = mobile ? '🖥 Desktop' : '📱 Mobile';
  // Sincroniza nav ativo
  syncNavActive();
}

function toggleMode(){
  const next = !isMobile;
  localStorage.setItem('financeiro-view-mode', next ? 'mobile' : 'desktop');
  applyMode(next);
}

function syncNavActive(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab === currentTab);
  });
  document.querySelectorAll('.mobile-nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab === currentTab);
  });
}

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CAT_FIXA = ['Moradia','Financiamento','Assinatura','Educação','Saúde','Transporte','Seguro','Utilidades','Telefonia/Internet','Pensão','Compras Parceladas','Vestuário','Crediário/Loja','Móveis/Eletrodomésticos','Empréstimo','Outros'];
const CAT_GASTO = ['Alimentação','Mercado','Vestuário','Transporte','Lazer','Saúde','Casa','Educação','Assinaturas','Pets','Presentes','Viagem','Compras','Outros'];
const CAT_ENTRADA = ['Salário','Freelance','Investimentos','Reembolso','Outros'];

function ymNow(){ return '2026-08'; }
function ymLabel(ym){ const [y,m]=ym.split('-').map(Number); return MESES[m-1]+'/'+String(y).slice(2); }
function ymFull(ym){ const [y,m]=ym.split('-').map(Number); return MESES[m-1]+' de '+y; }
function ymAdd(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); }
function ymDiff(a,b){ const [ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number); return (ya-yb)*12+(ma-mb); }
function brl(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// ---------- Google Drive ----------
const CLIENT_ID = '796724966722-628cflk7aci60vee2375dtrvps7mrbem.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = 'meu-financeiro-data.json';
const STORAGE_KEY = 'meu-financeiro-v1';

let gdriveToken = null;
let gdriveFileId = null;
let gdriveReady = false;
let gdriveClient = null;
let tokenRenewTimer = null;

function setStatus(msg){
  const s = document.getElementById('storage-status');
  const sm = document.getElementById('mobile-status');
  if(s) s.textContent = msg;
  if(sm) sm.textContent = msg;
  // Atualiza botão Drive mobile
  const btnm = document.getElementById('btn-gdrive-mobile');
  if(btnm && gdriveReady){ btnm.textContent = '✅ Drive'; btnm.style.background='var(--green)'; btnm.style.color='#fff'; }
}

// Carrega a lib do Google Identity Services dinamicamente
function loadGIS(){
  return new Promise(resolve=>{
    if(window.google && window.google.accounts){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = resolve;
    document.head.appendChild(s);
  });
}

// Renova token silenciosamente a cada 45 min (expira em 60)
function scheduleTokenRenew(){
  if(tokenRenewTimer) clearTimeout(tokenRenewTimer);
  tokenRenewTimer = setTimeout(async ()=>{
    if(!gdriveClient || !gdriveReady) return;
    gdriveClient.requestAccessToken({prompt:''});
  }, 45 * 60 * 1000);
}

function onTokenReceived(resp, isFirstLoad){
  if(resp.error){ 
    if(isFirstLoad) setStatus('💾 Salvo localmente · clique para conectar Drive');
    else setStatus('⚠️ Token expirado · reconectando…');
    return; 
  }
  gdriveToken = resp.access_token;
  gdriveReady = true;
  localStorage.setItem('gdrive-token-hint', '1');
  document.getElementById('btn-gdrive').textContent = '✅ Drive conectado';
  document.getElementById('btn-gdrive').style.background = 'var(--green)';
  scheduleTokenRenew();
  if(isFirstLoad){ setStatus('☁ Sincronizando…'); loadFromDrive(); }
  else setStatus('☁ Drive conectado · auto-salvo');
}

async function gdriveLogin(){
  setStatus('🔄 Conectando ao Google…');
  await loadGIS();
  gdriveClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => onTokenReceived(resp, true)
  });
  gdriveClient.requestAccessToken();
}

async function driveRequest(url, options={}){
  const res = await fetch(url, {
    ...options,
    headers: { 'Authorization': 'Bearer '+gdriveToken, ...(options.headers||{}) }
  });
  if(!res.ok){ const t=await res.text(); throw new Error(t); }
  return res;
}

async function findOrCreateFile(){
  if(gdriveFileId) return gdriveFileId;
  // Busca arquivo existente no appDataFolder
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length>0){ gdriveFileId = data.files[0].id; return gdriveFileId; }
  // Cria arquivo novo
  const meta = { name: DRIVE_FILE_NAME, parents: ['appDataFolder'] };
  const cr = await driveRequest('https://www.googleapis.com/drive/v3/files?fields=id', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(meta)
  });
  const created = await cr.json();
  gdriveFileId = created.id;
  return gdriveFileId;
}

async function loadFromDrive(){
  try{
    const fileId = await findOrCreateFile();
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const text = await res.text();
    if(text && text.startsWith('{')){
      appData = { recurringDebts:[], cards:[], purchases:[], expenses:[], incomes:[], ...JSON.parse(text) };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }
    setStatus('☁ Drive conectado · auto-salvo');
    render();
  }catch(e){
    // arquivo vazio ou novo — tudo certo
    setStatus('☁ Drive conectado · novo arquivo');
    render();
  }
}

async function saveToDrive(json){
  try{
    const fileId = await findOrCreateFile();
    await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: json
    });
  }catch(e){ console.error('Drive save error', e); setStatus('⚠️ Erro ao salvar no Drive'); }
}

// ---------- Persistência ----------
async function loadData(){
  // Tenta localStorage para exibir algo rápido
  try{
    const local = localStorage.getItem(STORAGE_KEY);
    if(local) appData = JSON.parse(local);
  }catch(e){}

  // Se já tinha token salvo, tenta reconectar silenciosamente
  if(localStorage.getItem('gdrive-token-hint')){
    setStatus('🔄 Reconectando ao Drive…');
    await loadGIS();
    try{
      gdriveClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPES,
        callback: (resp) => onTokenReceived(resp, true)
      });
      gdriveClient.requestAccessToken({prompt:''});
    }catch(e){ setStatus('💾 Salvo localmente · clique para conectar Drive'); render(); }
  } else {
    setStatus('💾 Salvo localmente · clique para conectar Drive');
    render();
  }
}

async function saveData(){
  const json = JSON.stringify(appData);
  // Sempre salva local
  try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
  // Salva no Drive se conectado
  if(gdriveReady && gdriveToken){ await saveToDrive(json); }
}

// ---------- Cálculos ----------
function fixedDebtsForMonth(ym){
  return appData.recurringDebts.filter(d => {
    if(d.startMonth > ym) return false;
    if(d.endMonth && d.endMonth < ym) return false;
    return true;
  });
}
function fixedAmountForMonth(d, ym){ const o = d.overrides && d.overrides[ym]; return (o && o.amount!=null) ? Number(o.amount) : Number(d.amount); }
function fixedPaidForMonth(d, ym){ return !!(d.overrides && d.overrides[ym] && d.overrides[ym].paid); }
function fixedTotalForMonth(ym){ return fixedDebtsForMonth(ym).reduce((s,d)=>s+fixedAmountForMonth(d,ym),0); }

function incomesForMonth(ym){ return appData.incomes.filter(i=>i.month===ym); }
function incomesTotalForMonth(ym){ return incomesForMonth(ym).reduce((s,i)=>s+Number(i.amount),0); }

function installmentValue(purchase, idx){
  const base = Math.floor((purchase.totalAmount/purchase.installments)*100)/100;
  const last = Math.round((purchase.totalAmount - base*(purchase.installments-1))*100)/100;
  return idx === purchase.installments-1 ? last : base;
}
function purchaseAmountForMonth(purchase, ym){
  const idx = ymDiff(ym, purchase.firstMonth);
  if(idx>=0 && idx<purchase.installments) return installmentValue(purchase, idx);
  return 0;
}
function cardInvoiceForMonth(cardId, ym){
  return appData.purchases.filter(p=>p.cardId===cardId).reduce((s,p)=>s+purchaseAmountForMonth(p,ym),0);
}
function allCardsTotalForMonth(ym){
  return appData.cards.reduce((s,c)=>s+cardInvoiceForMonth(c.id,ym),0);
}
function expensesForMonth(ym){ return appData.expenses.filter(e=>e.month===ym); }
function expensesTotalForMonth(ym){ return expensesForMonth(ym).reduce((s,e)=>s+Number(e.amount),0); }
function monthGrandTotal(ym){ return fixedTotalForMonth(ym)+allCardsTotalForMonth(ym)+expensesTotalForMonth(ym); }

function totalOutstandingDebt(){
  // Soma de parcelas futuras de compras + contas fixas com término definido, a partir do mês atual
  const now = ymNow();
  let total = 0;
  appData.purchases.forEach(p=>{
    for(let i=0;i<p.installments;i++){
      const ym = ymAdd(p.firstMonth,i);
      if(ym>=now) total += installmentValue(p,i);
    }
  });
  appData.recurringDebts.forEach(d=>{
    if(d.endMonth){
      let ym = d.startMonth>now?d.startMonth:now;
      while(ym<=d.endMonth){ total+=Number(d.amount); ym=ymAdd(ym,1); }
    }
  });
  return total;
}

// ---------- Render dispatcher ----------
function render(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.tab===currentTab));
  const main = document.getElementById('main');
  if(currentTab==='dashboard') main.innerHTML = renderDashboard();
  else if(currentTab==='entradas') main.innerHTML = renderEntradas();
  else if(currentTab==='fixas') main.innerHTML = renderFixas();
  else if(currentTab==='cartoes') main.innerHTML = renderCartoes();
  else if(currentTab==='gastos') main.innerHTML = renderGastos();
  else if(currentTab==='projecao') main.innerHTML = renderProjecao();
  attachHandlers();
}

// ---------- Dashboard ----------
function renderDashboard(){
  const ym = ymNow();
  const fixed = fixedTotalForMonth(ym), cards = allCardsTotalForMonth(ym), extra = expensesTotalForMonth(ym);
  const total = fixed+cards+extra;
  const income = incomesTotalForMonth(ym);
  const saldo = income - total;
  const outstanding = totalOutstandingDebt();
  let tape = '';
  const months = Array.from({length:12},(_,i)=>ymAdd(ym,i));
  const max = Math.max(...months.map(m=>fixedTotalForMonth(m)+allCardsTotalForMonth(m)), 1);
  months.forEach(m=>{
    const v = fixedTotalForMonth(m)+allCardsTotalForMonth(m);
    const h = Math.max(3, Math.round((v/max)*70));
    tape += `<div class="tape-month">
      <div class="tape-bar-wrap"><div class="tape-bar" style="height:${h}px; background:${m===ym?'var(--amber)':'var(--blue)'}"></div></div>
      <div class="tape-val">${Math.round(v)}</div>
      <div class="tape-label">${ymLabel(m)}</div>
    </div>`;
  });
  return `
    <div class="page-title">Dashboard</div>
    <div class="page-sub">Resumo de ${ymFull(ym)}</div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">Entradas do mês</div><div class="stat-value green mono">${brl(income)}</div><div class="stat-note">${incomesForMonth(ym).length} lançamento(s)</div></div>
      <div class="stat"><div class="stat-label">Contas fixas do mês</div><div class="stat-value blue mono">${brl(fixed)}</div><div class="stat-note">${fixedDebtsForMonth(ym).length} conta(s) ativa(s)</div></div>
      <div class="stat"><div class="stat-label">Faturas de cartão</div><div class="stat-value amber mono">${brl(cards)}</div><div class="stat-note">${appData.cards.length} cartão(ões)</div></div>
      <div class="stat"><div class="stat-label">Gastos extras</div><div class="stat-value red mono">${brl(extra)}</div><div class="stat-note">${expensesForMonth(ym).length} lançamento(s)</div></div>
      <div class="stat"><div class="stat-label">Total do mês</div><div class="stat-value mono" style="color:var(--text)">${brl(total)}</div></div>
      <div class="stat"><div class="stat-label">Saldo do mês</div><div class="stat-value mono ${saldo>=0?'green':'red'}">${brl(saldo)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">Dívida total em aberto (parcelas + contas futuras, a partir de hoje)</div>
      <div class="stat-value red mono" style="font-size:28px">${brl(outstanding)}</div>
    </div>
    <div class="panel">
      <div class="panel-title">Projeção — próximos 12 meses (fixas + cartões)</div>
      <div class="tape">${tape}</div>
    </div>
  `;
}

function renderCardPurchasesTable(cardId){
  const list = appData.purchases.filter(p=>p.cardId===cardId).sort((a,b)=>b.firstMonth.localeCompare(a.firstMonth));
  if(!list.length) return '<div class="empty">Nenhuma compra lançada.</div>';
  const rows = list.map(p=>{
    const idx = ymDiff(viewMonth, p.firstMonth);
    const statusTxt = idx<0 ? 'futura' : idx>=p.installments ? 'quitada' : `parcela ${idx+1}/${p.installments}`;
    const statusTag = idx<0?'blue': idx>=p.installments?'green':'amber';
    return `<tr>
      <td>${p.description}</td>
      <td><span class="tag ${p.installments>1?'amber':'blue'}">${p.installments>1?p.installments+'x':'à vista'}</span></td>
      <td class="num">${brl(p.totalAmount)}</td>
      <td>${ymLabel(p.firstMonth)}</td>
      <td><span class="tag ${statusTag}">${statusTxt}</span></td>
      <td>
        <button class="btn-icon" data-edit-purchase="${p.id}">✎</button>
        <button class="btn-icon" data-del-purchase="${p.id}">✕</button>
      </td>
    </tr>`;
  }).join('');
  return `<table><thead><tr><th>Descrição</th><th>Tipo</th><th>Total</th><th>1ª parcela</th><th>Status em ${ymLabel(viewMonth)}</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---------- Projeção ----------
function renderProjecao(){
  const now = ymNow();
  const months = Array.from({length:projRange},(_,i)=>ymAdd(now,i));
  let cum=0;
  const rows = months.map(m=>{
    const f=fixedTotalForMonth(m), c=allCardsTotalForMonth(m), g=expensesTotalForMonth(m), t=f+c+g;
    cum+=t;
    return `<tr>
      <td>${ymFull(m)}${m===now?' <span class="tag amber">atual</span>':''}</td>
      <td class="num">${brl(f)}</td>
      <td class="num">${brl(c)}</td>
      <td class="num">${g?brl(g):'<span style="color:var(--text-faint)">—</span>'}</td>
      <td class="num" style="font-weight:700">${brl(t)}</td>
      <td class="num" style="color:var(--text-dim)">${brl(cum)}</td>
    </tr>`;
  }).join('');
  return `
    <div class="page-title">Projeção de Dívidas</div>
    <div class="page-sub">Compromissos futuros: contas fixas + parcelas de cartão já lançadas. Gastos extras aparecem apenas nos meses em que já foram lançados.</div>
    <div class="form-row" style="margin-bottom:18px">
      <div class="field" style="max-width:160px"><label>Horizonte</label>
        <select id="proj-range">
          <option value="6" ${projRange===6?'selected':''}>6 meses</option>
          <option value="12" ${projRange===12?'selected':''}>12 meses</option>
          <option value="24" ${projRange===24?'selected':''}>24 meses</option>
          <option value="36" ${projRange===36?'selected':''}>36 meses</option>
        </select>
      </div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Mês</th><th>Contas fixas</th><th>Cartões</th><th>Gastos extras</th><th>Total do mês</th><th>Acumulado</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// ---------- Handlers ----------
function attachHandlers(){
  document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>{ currentTab=n.dataset.tab; editing={fixas:null,cartoes:null,gastos:null,purchaseCard:null,fixaOverride:null,entradaEdit:null,purchaseEdit:null}; render(); });
  document.querySelectorAll('.mobile-nav-item').forEach(n=>n.onclick=()=>{ currentTab=n.dataset.tab; editing={fixas:null,cartoes:null,gastos:null,purchaseCard:null,fixaOverride:null,entradaEdit:null,purchaseEdit:null}; render(); });

  // Fixas
  const formFixa = document.getElementById('form-fixa');
  if(formFixa) formFixa.onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(formFixa);
    const obj = { id: editing.fixas || uid(), name:f.get('name'), category:f.get('category'), amount:parseFloat(f.get('amount')), dueDay:parseInt(f.get('dueDay')), startMonth:f.get('startMonth'), endMonth:f.get('endMonth')||null };
    if(editing.fixas){ appData.recurringDebts = appData.recurringDebts.map(d=>d.id===obj.id?obj:d); }
    else appData.recurringDebts.push(obj);
    editing.fixas=null; await saveData(); render();
  };
  document.querySelectorAll('[data-edit-fixa]').forEach(b=>b.onclick=()=>{ editing.fixas=b.dataset.editFixa; render(); });
  document.querySelectorAll('[data-del-fixa]').forEach(b=>b.onclick=async()=>{ appData.recurringDebts=appData.recurringDebts.filter(d=>d.id!==b.dataset.delFixa); await saveData(); render(); });
  const cancelFixa = document.getElementById('cancel-fixa'); if(cancelFixa) cancelFixa.onclick=()=>{editing.fixas=null; render();};

  // Ajuste de valor mensal / status pago das contas fixas
  document.querySelectorAll('[data-adjust-fixa]').forEach(b=>b.onclick=()=>{ editing.fixaOverride = editing.fixaOverride===b.dataset.adjustFixa?null:b.dataset.adjustFixa; render(); });
  const formFixaAdjust = document.getElementById('form-fixa-adjust');
  if(formFixaAdjust) formFixaAdjust.onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(formFixaAdjust);
    const debt = appData.recurringDebts.find(d=>d.id===editing.fixaOverride);
    if(debt){
      debt.overrides = debt.overrides || {};
      debt.overrides[viewMonth] = { ...(debt.overrides[viewMonth]||{}), amount: parseFloat(f.get('amount')) };
    }
    editing.fixaOverride=null; await saveData(); render();
  };
  const cancelFixaAdjust = document.getElementById('cancel-fixa-adjust'); if(cancelFixaAdjust) cancelFixaAdjust.onclick=()=>{editing.fixaOverride=null; render();};
  const resetFixaAdjust = document.getElementById('reset-fixa-adjust');
  if(resetFixaAdjust) resetFixaAdjust.onclick=async()=>{
    const debt = appData.recurringDebts.find(d=>d.id===editing.fixaOverride);
    if(debt && debt.overrides && debt.overrides[viewMonth]){ delete debt.overrides[viewMonth].amount; }
    editing.fixaOverride=null; await saveData(); render();
  };
  document.querySelectorAll('[data-toggle-fixa-paid]').forEach(cb=>cb.onchange=async()=>{
    const debt = appData.recurringDebts.find(d=>d.id===cb.dataset.toggleFixaPaid);
    if(debt){
      debt.overrides = debt.overrides || {};
      debt.overrides[viewMonth] = { ...(debt.overrides[viewMonth]||{}), paid: cb.checked };
    }
    await saveData(); render();
  });

  // Cartões
  const formCard = document.getElementById('form-card');
  if(formCard) formCard.onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(formCard);
    appData.cards.push({ id:uid(), name:f.get('name'), limit:parseFloat(f.get('limit')), closingDay:parseInt(f.get('closingDay')), dueDay:parseInt(f.get('dueDay')) });
    await saveData(); render();
  };
  document.querySelectorAll('[data-del-card]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.delCard;
    appData.cards=appData.cards.filter(c=>c.id!==id);
    appData.purchases=appData.purchases.filter(p=>p.cardId!==id);
    await saveData(); render();
  });
  document.querySelectorAll('[data-add-purchase]').forEach(b=>b.onclick=()=>{ editing.purchaseCard = editing.purchaseCard===b.dataset.addPurchase?null:b.dataset.addPurchase; editing.purchaseEdit=null; render(); });
  document.querySelectorAll('[data-edit-purchase]').forEach(b=>b.onclick=()=>{ editing.purchaseEdit = editing.purchaseEdit===b.dataset.editPurchase?null:b.dataset.editPurchase; editing.purchaseCard=null; render(); });
  const formPurchase = document.getElementById('form-purchase');
  if(formPurchase) formPurchase.onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(formPurchase);
    const editId = formPurchase.dataset.edit;
    if(editId){
      const p = appData.purchases.find(x=>x.id===editId);
      if(p){
        p.description=f.get('description'); p.totalAmount=parseFloat(f.get('totalAmount'));
        p.installments=parseInt(f.get('installments')); p.firstMonth=f.get('firstMonth');
      }
      editing.purchaseEdit=null;
    } else {
      appData.purchases.push({ id:uid(), cardId:formPurchase.dataset.card, description:f.get('description'), totalAmount:parseFloat(f.get('totalAmount')), installments:parseInt(f.get('installments')), firstMonth:f.get('firstMonth') });
      editing.purchaseCard=null;
    }
    await saveData(); render();
  };
  const cancelPurchase = document.getElementById('cancel-purchase'); if(cancelPurchase) cancelPurchase.onclick=()=>{editing.purchaseCard=null; editing.purchaseEdit=null; render();};
  document.querySelectorAll('[data-del-purchase]').forEach(b=>b.onclick=async()=>{ appData.purchases=appData.purchases.filter(p=>p.id!==b.dataset.delPurchase); await saveData(); render(); });

  // Gastos
  const formExpense = document.getElementById('form-expense');
  if(formExpense) formExpense.onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(formExpense);
    appData.expenses.push({ id:uid(), month:viewMonth, description:f.get('description'), category:f.get('category'), amount:parseFloat(f.get('amount')), date:f.get('date')||null, paid:false });
    await saveData(); render();
  };
  document.querySelectorAll('[data-del-expense]').forEach(b=>b.onclick=async()=>{ appData.expenses=appData.expenses.filter(x=>x.id!==b.dataset.delExpense); await saveData(); render(); });
  document.querySelectorAll('[data-toggle-expense-paid]').forEach(cb=>cb.onchange=async()=>{
    const exp = appData.expenses.find(x=>x.id===cb.dataset.toggleExpensePaid);
    if(exp) exp.paid = cb.checked;
    await saveData(); render();
  });

  // Entradas
  const formIncome = document.getElementById('form-income');
  if(formIncome) formIncome.onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(formIncome);
    if(editing.entradaEdit){
      const inc = appData.incomes.find(i=>i.id===editing.entradaEdit);
      if(inc){
        inc.description=f.get('description'); inc.category=f.get('category');
        inc.amount=parseFloat(f.get('amount')); inc.date=f.get('date')||null;
        const newMonth=f.get('month'); if(newMonth) inc.month=newMonth;
      }
      editing.entradaEdit=null;
    } else {
      const base = { description:f.get('description'), category:f.get('category'), amount:parseFloat(f.get('amount')) };
      const repeatUntil = f.get('repeatUntil');
      if(repeatUntil && repeatUntil>=viewMonth){
        let m = viewMonth, first = true, guard = 0;
        while(m<=repeatUntil && guard<60){
          appData.incomes.push({ id:uid(), month:m, ...base, date: first?(f.get('date')||null):null });
          first=false; m=ymAdd(m,1); guard++;
        }
      } else {
        appData.incomes.push({ id:uid(), month:viewMonth, ...base, date:f.get('date')||null });
      }
    }
    await saveData(); render();
  };
  document.querySelectorAll('[data-edit-income]').forEach(b=>b.onclick=()=>{ editing.entradaEdit = editing.entradaEdit===b.dataset.editIncome?null:b.dataset.editIncome; render(); });
  const cancelIncome = document.getElementById('cancel-income'); if(cancelIncome) cancelIncome.onclick=()=>{editing.entradaEdit=null; render();};
  document.querySelectorAll('[data-del-income]').forEach(b=>b.onclick=async()=>{ appData.incomes=appData.incomes.filter(x=>x.id!==b.dataset.delIncome); await saveData(); render(); });

  // Month nav
  document.querySelectorAll('[data-month-nav]').forEach(b=>b.onclick=()=>{ viewMonth = ymAdd(viewMonth, parseInt(b.dataset.monthNav)); render(); });
  const todayBtn = document.querySelector('[data-month-today]'); if(todayBtn) todayBtn.onclick=()=>{ viewMonth=ymNow(); render(); };

  // Projeção range
  const projSel = document.getElementById('proj-range'); if(projSel) projSel.onchange=()=>{ projRange=parseInt(projSel.value); render(); };
}

// ---------- Backup / Restore ----------
function exportData(){
  const blob = new Blob([JSON.stringify(appData, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'meu-financeiro-backup-' + ymNow() + '.json';
  a.click();
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try{
      const parsed = JSON.parse(ev.target.result);
      if(parsed && typeof parsed === 'object'){
        appData = { recurringDebts:[], cards:[], purchases:[], expenses:[], incomes:[], ...parsed };
        await saveData();
        render();
        document.getElementById('storage-status').textContent = '✅ Importado com sucesso!';
      }
    }catch(err){ alert('Arquivo inválido. Use um backup gerado por este app.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// Inicializa modo (mobile ou desktop)
applyMode(detectMode());

loadData();
</script>
